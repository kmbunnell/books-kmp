name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Nightly at 03:00 UTC
  pull_request:
    branches:
      - develop
    paths:
      - 'shared/src/**/data/library/**'
      - 'shared-integration-tests/**'
      - 'supabase/migrations/**'

jobs:
  integration-tests:
    name: Run SupabaseBookRepository integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Seed local.properties
        # composeApp build reads SUPABASE_URL / SUPABASE_ANON_KEY at config time;
        # Gradle evaluates all subprojects even when a single task is requested,
        # so placeholders are required even though integration tests don't use them.
        run: |
          {
            echo 'SUPABASE_URL=https://placeholder.supabase.co'
            echo 'SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJwbGFjZWhvbGRlciIsInJvbGUiOiJhbm9uIn0.placeholder-signature-not-a-real-key'
          } > local.properties

      - name: Install Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51  # v1 (v1.6.0)
        with:
          version: 2.75.0

      - name: Start Supabase
        run: supabase start

      - name: Capture Supabase credentials
        run: |
          echo "SUPABASE_URL=$(supabase status -o json | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_ENV"

      - name: Seed test user
        # `supabase` CLI has no user-seeding subcommand, so call the Auth admin API
        # directly with the local service-role key from `supabase status`.
        run: |
          SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)
          curl -fsS -X POST http://127.0.0.1:54321/auth/v1/admin/users \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"test@books.local","password":"Test1234!","email_confirm":true}'

      - name: Run integration tests
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: ./gradlew :shared-integration-tests:jvmTest

      - name: Stop Supabase
        if: always()
        run: supabase stop

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: shared-integration-tests/build/reports/tests/jvmTest/
          retention-days: 7
