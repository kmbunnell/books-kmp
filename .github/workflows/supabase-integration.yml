name: Supabase integration tests

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'supabase/**'

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Edge Function integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start Supabase local stack
        run: supabase start

      - name: Export Supabase keys
        run: |
          supabase status --output env | grep "^ANON_KEY=" | sed 's/^ANON_KEY=/SUPABASE_ANON_KEY=/' >> $GITHUB_ENV
          supabase status --output env | grep "^SERVICE_ROLE_KEY=" | sed 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' >> $GITHUB_ENV

      - name: Serve functions in background
        run: |
          supabase functions serve lookup-book &
          supabase functions serve evict-cache &

      - name: Wait for functions to be ready
        run: |
          until curl --silent --output /dev/null --max-time 3 \
            -X POST http://localhost:54321/functions/v1/lookup-book \
            -H "Content-Type: application/json" -d '{}'; do
            echo "Waiting for lookup-book..."
            sleep 2
          done
          until curl --silent --output /dev/null --max-time 3 \
            -X POST http://localhost:54321/functions/v1/evict-cache \
            -H "Content-Type: application/json"; do
            echo "Waiting for evict-cache..."
            sleep 2
          done

      - name: Run integration tests
        run: |
          deno test --allow-net --allow-env supabase/functions/lookup-book/index.test.ts
          deno test --allow-net --allow-env supabase/functions/evict-cache/index.test.ts
