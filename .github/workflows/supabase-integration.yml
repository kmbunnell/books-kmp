name: Supabase integration tests

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'supabase/**'

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Edge Function integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start Supabase local stack
        run: supabase start

      - name: Export Supabase keys
        run: |
          supabase status --output env | grep "PUBLISHABLE_KEY=" | sed 's/.*PUBLISHABLE_KEY=/SUPABASE_PUBLISHABLE_KEY=/' | tr -d '"' >> $GITHUB_ENV

      - name: Generate ES256 JWTs
        run: |
          SERVICE_ROLE_JWT=$(deno run --allow-run scripts/generate-service-jwt.ts supabase_auth_books-kmp service_role)
          ANON_JWT=$(deno run --allow-run scripts/generate-service-jwt.ts supabase_auth_books-kmp anon)
          echo "SUPABASE_SERVICE_ROLE_JWT=$SERVICE_ROLE_JWT" >> $GITHUB_ENV
          echo "SUPABASE_ANON_JWT=$ANON_JWT" >> $GITHUB_ENV

      - name: Serve functions in background
        run: |
          supabase functions serve lookup-book &
          supabase functions serve evict-cache &

      - name: Wait for functions to be ready
        run: |
          until curl --silent --output /dev/null --max-time 3 \
            -X POST http://localhost:54321/functions/v1/lookup-book \
            -H "Content-Type: application/json" -d '{}'; do
            echo "Waiting for lookup-book..."
            sleep 2
          done
          until curl --silent --fail --output /dev/null --max-time 3 \
            -X POST http://localhost:54321/functions/v1/evict-cache \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_JWT" \
            -d '{}'; do
            echo "Waiting for evict-cache..."
            sleep 2
          done

      - name: Run integration tests
        run: |
          deno test --allow-net --allow-env --node-modules-dir=auto supabase/functions/lookup-book/index.test.ts
          deno test --allow-net --allow-env --node-modules-dir=auto supabase/functions/evict-cache/index.test.ts
