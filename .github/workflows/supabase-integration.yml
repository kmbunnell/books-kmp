name: Supabase integration tests

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'supabase/**'

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Edge Function integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start Supabase local stack
        run: supabase start

      - name: Serve lookup-book in background
        run: supabase functions serve lookup-book &

      - name: Wait for function to be ready
        run: |
          until curl --silent --output /dev/null --max-time 3 \
            -X POST http://localhost:54321/functions/v1/lookup-book \
            -H "Content-Type: application/json" -d '{}'; do
            echo "Waiting for function..."
            sleep 2
          done

      - name: Run integration tests
        run: deno test --allow-net --allow-env supabase/functions/lookup-book/index.test.ts
